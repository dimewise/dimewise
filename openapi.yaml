openapi: 3.0.0
info:
  title: Sample API
  description: A simple API to demonstrate OpenAPI 3.0 YAML structure
  version: 1.0.0
servers:
  - url: http://api.example.com/v1
    description: Production server
paths:
  /hello:
    get:
      summary: Returns a greeting message
      responses:
        '200':
          description: Successful response
          content:
            text/plain:
              schemm:
                type: string
              example: Hello, World!
