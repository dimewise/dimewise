name: Build and Push Server Images
run-name: Build Server Images - ${{ github.ref_name }}

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Application Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/build/Dockerfile-server.build
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dimewise-server:${{ github.ref_name }}

      - name: Build and push Migration Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/build/Dockerfile-migrate.build
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dimewise-migrate:${{ github.ref_name }}
