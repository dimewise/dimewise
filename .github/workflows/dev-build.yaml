name: dev-build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # We'll use a specific IMAGE_BASE_NAME to simplify the tagging for both images
  IMAGE_BASE_NAME: ${{ github.repository_owner }}/dimewise # Use your preferred base name

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build and Push Application Image (dimewise-app)
      - name: Build and Push Application Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./build/Dockerfile-server.build
          push: true
          tags: |
            # Tags for the Application Image: dimewise-app
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE_NAME }}-app:main-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE_NAME }}-app:main

      # 2. Build and Push Migration Image (dimewise-migrate)
      - name: Build and Push Migration Image
        uses: docker/build-push-action@v5
        with:
          context: .
          # Using your specified path for the migration Dockerfile
          file: ./build/Dockerfile-migrate.build
          push: true
          tags: |
            # Tags for the Migration Image: dimewise-migrate
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE_NAME }}-migrate:main-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE_NAME }}-migrate:main
