---
services:
  postgres:
    image: postgres:18.2
    container_name: dimewise-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dimewise
      PGDATA: /var/lib/postgresql/data/pgdata
    ports: [6432:5432]
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD, pg_isready, -U, postgres]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:8.4
    container_name: dimewise-redis
    ports: [7379:6379]
    volumes: [redisdata:/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 5
  client:
    image: oven/bun:1.3
    container_name: dimewise-client
    user: ${UID:-1000}:${GID:-1000}
    restart: unless-stopped
    ports: [3001:3000]
    volumes: [./client:/app:Z]
    working_dir: /app
    entrypoint: /bin/sh -c "bun install && bun run dev"
volumes:
  pgdata:
  redisdata:
