apiVersion: apps/v1
kind: Deployment
metadata:
  name: dimewise-server      # match your Argo CD app name
  namespace: dimewise-server        # must be the same namespace you told Argo
spec:
  replicas: 2                # start small, let HPA scale later
  selector:
    matchLabels:
      app: dimewise-server
  template:
    metadata:
      labels:
        app: dimewise-server
    spec:
      containers:
      - name: server
        image: ghcr.io/dimewise/dimewise-server:1.0.0   # or Docker Hub, etc.
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        resources:            # good citizen limits
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health     # expose this endpoint in your code
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
