openapi: 3.0.0
info:
  title: Dimewise API
  version: 1.0.0

paths:
  /users/me:
    get:
      summary: Get current user profile
      operationId: getUsersMe
      tags:
        - Users
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /households:
    post:
      summary: Create a new household
      operationId: createHousehold
      tags:
        - Households
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHouseholdRequest'
      responses:
        '201':
          description: Household created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      summary: Delete the current user's household (owner only)
      operationId: deleteHousehold
      tags:
        - Households
      responses:
        '204':
          description: Household deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /households/me:
    get:
      summary: Get the current user's household with members
      operationId: getMyHousehold
      tags:
        - Households
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdWithMembers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /households/join:
    post:
      summary: Join a household via invite code
      operationId: joinHousehold
      tags:
        - Households
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinHouseholdRequest'
      responses:
        '200':
          description: Joined household
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdWithMembers'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /households/invite-code/regenerate:
    post:
      summary: Regenerate the household invite code (owner only)
      operationId: regenerateInviteCode
      tags:
        - Households
      responses:
        '200':
          description: New invite code generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /households/members/{userId}:
    delete:
      summary: Remove a member from the household (owner only)
      operationId: removeHouseholdMember
      tags:
        - Households
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Member removed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /households/leave:
    post:
      summary: Leave the current household (non-owner only)
      operationId: leaveHousehold
      tags:
        - Households
      responses:
        '204':
          description: Left household
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /budgets:
    get:
      summary: List budget categories for the current household
      operationId: listBudgetCategories
      tags:
        - Budgets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BudgetCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create a budget category
      operationId: createBudgetCategory
      tags:
        - Budgets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBudgetCategoryRequest'
      responses:
        '201':
          description: Budget category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /budgets/{budgetId}:
    patch:
      summary: Update a budget category
      operationId: updateBudgetCategory
      tags:
        - Budgets
      parameters:
        - name: budgetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBudgetCategoryRequest'
      responses:
        '200':
          description: Budget category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Soft-delete a budget category
      operationId: deleteBudgetCategory
      tags:
        - Budgets
      parameters:
        - name: budgetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Budget category deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /budgets/overview:
    get:
      summary: Get budget overview for the current month
      operationId: getBudgetOverview
      tags:
        - Budgets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /expenses:
    get:
      summary: List expenses for the current household
      operationId: listExpenses
      tags:
        - Expenses
      parameters:
        - name: category_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: paid_by
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create an expense with splits
      operationId: createExpense
      tags:
        - Expenses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpenseRequest'
      responses:
        '201':
          description: Expense created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseWithSplits'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /expenses/{expenseId}:
    get:
      summary: Get expense detail with splits
      operationId: getExpense
      tags:
        - Expenses
      parameters:
        - name: expenseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseWithSplits'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update an expense
      operationId: updateExpense
      tags:
        - Expenses
      parameters:
        - name: expenseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExpenseRequest'
      responses:
        '200':
          description: Expense updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseWithSplits'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete an expense
      operationId: deleteExpense
      tags:
        - Expenses
      parameters:
        - name: expenseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Expense deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /settlements:
    get:
      summary: List settlements for the current household
      operationId: listSettlements
      tags:
        - Settlements
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Settlement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /settlements/generate:
    post:
      summary: Manually generate a settlement for a given month
      operationId: generateSettlement
      tags:
        - Settlements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateSettlementRequest'
      responses:
        '201':
          description: Settlement generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementWithTransfers'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /settlements/{settlementId}:
    get:
      summary: Get settlement detail with transfers
      operationId: getSettlement
      tags:
        - Settlements
      parameters:
        - name: settlementId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementWithTransfers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /settlements/transfers/{transferId}/pay:
    patch:
      summary: Mark a settlement transfer as paid
      operationId: markTransferPaid
      tags:
        - Settlements
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transfer marked as paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementTransfer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  responses:
    BadRequest:
      description: The request was malformed or invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Authentication is required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: The authenticated user does not have permission
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: The requested resource was not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: The request conflicts with the current state
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    BaseEntity:
      type: object
      required: [id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    User:
      allOf:
        - $ref: '#/components/schemas/BaseEntity'
        - type: object
          required: [email]
          properties:
            email: { type: string, format: email }
            first_name: { type: string }
            last_name: { type: string }
            avatar_url: { type: string }

    Household:
      allOf:
        - $ref: '#/components/schemas/BaseEntity'
        - type: object
          required: [name, currency, invite_code, owner_id]
          properties:
            name: { type: string }
            currency: { type: string, description: 'ISO 4217 currency code' }
            invite_code: { type: string }
            owner_id: { type: string, format: uuid }

    HouseholdMember:
      type: object
      required: [id, user_id, email, joined_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        avatar_url: { type: string }
        joined_at: { type: string, format: date-time }

    HouseholdWithMembers:
      allOf:
        - $ref: '#/components/schemas/Household'
        - type: object
          required: [members]
          properties:
            members:
              type: array
              items:
                $ref: '#/components/schemas/HouseholdMember'

    CreateHouseholdRequest:
      type: object
      required: [name, currency]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        currency:
          type: string
          description: 'ISO 4217 currency code'
          enum: [USD, EUR, GBP, CAD, AUD, SGD, HKD, NZD, CHF, JPY, KRW]

    JoinHouseholdRequest:
      type: object
      required: [invite_code]
      properties:
        invite_code:
          type: string

    BudgetCategory:
      allOf:
        - $ref: '#/components/schemas/BaseEntity'
        - type: object
          required: [household_id, name, amount, sort_order]
          properties:
            household_id: { type: string, format: uuid }
            name: { type: string }
            amount:
              type: integer
              format: int64
              description: Monthly budget in smallest currency unit (e.g. cents)
            sort_order: { type: integer }

    CreateBudgetCategoryRequest:
      type: object
      required: [name, amount]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Monthly budget in smallest currency unit

    UpdateBudgetCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Monthly budget in smallest currency unit
        sort_order:
          type: integer
          minimum: 0

    BudgetOverview:
      type: object
      required: [total_budget, total_spent, remaining, categories]
      properties:
        total_budget:
          type: integer
          format: int64
          description: Sum of all budget category amounts
        total_spent:
          type: integer
          format: int64
          description: Total spent this month across all categories
        remaining:
          type: integer
          format: int64
          description: total_budget minus total_spent
        categories:
          type: array
          items:
            $ref: '#/components/schemas/BudgetCategoryOverview'

    BudgetCategoryOverview:
      type: object
      required: [id, name, budget, spent, remaining]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        budget:
          type: integer
          format: int64
        spent:
          type: integer
          format: int64
        remaining:
          type: integer
          format: int64

    Expense:
      allOf:
        - $ref: '#/components/schemas/BaseEntity'
        - type: object
          required: [household_id, paid_by, logged_by, title, amount, incurred_at]
          properties:
            household_id: { type: string, format: uuid }
            budget_category_id: { type: string, format: uuid }
            paid_by: { type: string, format: uuid }
            logged_by: { type: string, format: uuid }
            title: { type: string }
            amount:
              type: integer
              format: int64
              description: Amount in smallest currency unit
            notes: { type: string }
            incurred_at: { type: string, format: date-time }

    ExpenseSplit:
      type: object
      required: [id, expense_id, user_id, amount]
      properties:
        id: { type: string, format: uuid }
        expense_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        amount:
          type: integer
          format: int64
          description: Split amount in smallest currency unit

    ExpenseWithSplits:
      allOf:
        - $ref: '#/components/schemas/Expense'
        - type: object
          required: [splits]
          properties:
            splits:
              type: array
              items:
                $ref: '#/components/schemas/ExpenseSplit'

    ExpenseListResponse:
      type: object
      required: [expenses, total]
      properties:
        expenses:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseWithSplits'
        total:
          type: integer
          description: Total number of matching expenses (for pagination)

    CreateExpenseRequest:
      type: object
      required: [paid_by, title, amount, incurred_at, splits]
      properties:
        paid_by:
          type: string
          format: uuid
        budget_category_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 255
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Amount in smallest currency unit
        notes:
          type: string
          maxLength: 1000
        incurred_at:
          type: string
          format: date-time
        splits:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ExpenseSplitInput'

    UpdateExpenseRequest:
      type: object
      properties:
        paid_by:
          type: string
          format: uuid
        budget_category_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 255
        amount:
          type: integer
          format: int64
          minimum: 1
        notes:
          type: string
          maxLength: 1000
        incurred_at:
          type: string
          format: date-time
        splits:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ExpenseSplitInput'

    ExpenseSplitInput:
      type: object
      required: [user_id, amount]
      properties:
        user_id:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
          minimum: 0
          description: Split amount in smallest currency unit

    Settlement:
      allOf:
        - $ref: '#/components/schemas/BaseEntity'
        - type: object
          required: [household_id, month, year, generated_at]
          properties:
            household_id: { type: string, format: uuid }
            month: { type: integer }
            year: { type: integer }
            generated_at: { type: string, format: date-time }

    SettlementTransfer:
      allOf:
        - $ref: '#/components/schemas/BaseEntity'
        - type: object
          required: [settlement_id, from_user_id, to_user_id, amount]
          properties:
            settlement_id: { type: string, format: uuid }
            from_user_id: { type: string, format: uuid }
            to_user_id: { type: string, format: uuid }
            amount:
              type: integer
              format: int64
              description: Transfer amount in smallest currency unit
            paid_at: { type: string, format: date-time }

    SettlementWithTransfers:
      allOf:
        - $ref: '#/components/schemas/Settlement'
        - type: object
          required: [transfers]
          properties:
            transfers:
              type: array
              items:
                $ref: '#/components/schemas/SettlementTransfer'

    GenerateSettlementRequest:
      type: object
      required: [month, year]
      properties:
        month:
          type: integer
          minimum: 1
          maximum: 12
        year:
          type: integer
          minimum: 2020

    # RFC 9457 Problem Details
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          format: uri
          default: 'about:blank'
          description: A URI reference that identifies the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          description: The HTTP status code generated by the origin server.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri
          description: A URI reference that identifies the specific occurrence.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
          description: Optional list of individual field errors (common for 400 errors).

    ValidationError:
      type: object
      properties:
        field:
          type: string
          description: The JSON path to the field that failed (e.g., "email").
        message:
          type: string
          description: A description of why the field failed validation.
